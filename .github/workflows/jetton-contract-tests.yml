name: EmpireCoin Jetton contract checks

on:
  workflow_dispatch:
  push:
    paths:
      - "contracts/empirecoin/**"
      - ".github/workflows/jetton-contract-tests.yml"
  pull_request:
    paths:
      - "contracts/empirecoin/**"
      - ".github/workflows/jetton-contract-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
        with:
          version: "1.2.1"
          architecture: x86_64
          platform: linux
      - name: Build Jetton contracts
        working-directory: contracts/empirecoin
        run: acton build --output-boc build/boc --output-sources build/sources
      - name: Run Jetton test suite
        working-directory: contracts/empirecoin
        run: acton test tests
      - name: Exercise Testnet deployment script in local emulator
        working-directory: contracts/empirecoin
        env:
          JETTON_DEPLOYER: ci-deployer
          JETTON_ADMIN_ADDRESS: 0QBa9SNhRIiPFJZRt3FROllgc70DOBmdLTKV9dxsTl2H2B4D
          JETTON_NAME: EmpireCoin
          JETTON_SYMBOL: EMPC
          JETTON_DESCRIPTION: EmpireCoin CI deployment-script check
          JETTON_IMAGE: https://qanas72.github.io/EmpireCoin-MiniApp/tonconnect-icon.png
          JETTON_DECIMALS: "9"
          JETTON_INITIAL_SUPPLY: "0"
        run: acton script scripts/deploy.tolk
      - name: Check and format
        working-directory: contracts/empirecoin
        run: |
          acton check
          acton fmt --check
      - name: Upload compiled Testnet deployment artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: empirecoin-testnet-build-${{ github.sha }}
          path: |
            contracts/empirecoin/build/
          if-no-files-found: error
          retention-days: 14
