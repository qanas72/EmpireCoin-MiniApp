<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#160d18" />
<meta name="description" content="EmpireCoin Nova — TON-powered digital economy." />
<title>EmpireCoin Nova</title>
<link rel="icon" type="image/svg+xml" href="../v3/crown.svg" />
<script>
  (function () {
    function report(message) {
      var root = document.getElementById('nova-root');
      if (!root || root.dataset.reactMounted === 'true') return;
      root.innerHTML = '<p class="boot" style="overflow-wrap:anywhere;padding:24px">' + message + '</p>';
    }
    window.addEventListener('error', function (event) {
      var target = event.target;
      if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
        report('Nova file loading error: ' + (target.src || target.href || target.tagName) + '. Please send this screenshot to support.');
      } else if (event.message) {
        report('Nova JavaScript error: ' + event.message + (event.filename ? ' (' + event.filename + ':' + event.lineno + ')' : ''));
      }
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      report('Nova startup rejection: ' + String(reason && (reason.message || reason)));
    });
    window.setTimeout(function () {
      var root = document.getElementById('nova-root');
      if (!root || root.dataset.reactMounted === 'true') return;
      if (root.dataset.scriptLoaded !== 'true') {
        report('Nova entry module did not start. Check the required JavaScript bundle and module-preload file. Send this screenshot to support.');
      } else if (root.querySelector('.boot')) {
        report('Nova loaded its files but could not start React. Please send this screenshot to support.');
      }
    }, 12000);
  })();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="nova-root"><p class="boot">EmpireCoin Nova is loading… (build 2026.11.11.4)</p></div>
<script type="module" src="../src/nova-main.tsx"></script>
</body>
</html>
