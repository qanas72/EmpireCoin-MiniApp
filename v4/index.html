<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#160d18" />
<meta name="description" content="EmpireCoin Nova — TON-powered digital economy." />
<title>EmpireCoin Nova</title>
<link rel="icon" type="image/svg+xml" href="../v3/crown.svg" />
<script>
  window.setTimeout(() => {
    const root = document.getElementById('nova-root')
    if (!root || root.dataset.reactMounted === 'true') return
    if (root.dataset.scriptLoaded !== 'true') {
      root.innerHTML = '<p class="boot">Nova could not load its application files. Refresh the page and send this message to support.</p>'
    } else if (root.querySelector('.boot')) {
      root.innerHTML = '<p class="boot">Nova loaded its files but could not start React. Please send a screenshot to support.</p>'
    }
  }, 12000)
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="nova-root"><p class="boot">EmpireCoin Nova is loading…</p></div>
<script type="module" src="../src/nova-main.tsx"></script>
</body>
</html>
